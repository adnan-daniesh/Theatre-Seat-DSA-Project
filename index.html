<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theatre Seat Allocation – DSA Linked List Project</title>
<style>
:root{--bg:#16122b;--card:#221c42;--ink:#f1ecff;--muted:#a99fd0;--line:#3b3366;--gold:#f2b84b;--free:#3b6e5a;--taken:#a63d52;--mine:#f2b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px}
main{max-width:820px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.8rem;color:var(--gold)}
.sub{color:var(--muted);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:#241a05;cursor:pointer;font-weight:600}
button:focus-visible,input:focus-visible,.seat:focus-visible{outline:3px solid #fff;outline-offset:2px}
#msg{min-height:1.4em;margin:8px 0 0;color:var(--gold)}
.screen{height:10px;border-radius:50%/100%;background:linear-gradient(var(--gold),transparent);margin:6px 8% 18px;opacity:.8}
.hall{overflow-x:auto;padding-bottom:6px}
.rw{display:flex;align-items:center;gap:6px;margin-bottom:6px;width:max-content;margin-inline:auto}
.lab{width:20px;color:var(--muted);font-weight:700}
.seat{width:40px;height:36px;border-radius:8px 8px 4px 4px;border:0;font:.8rem inherit;font-weight:600;color:#fff;background:var(--free);padding:0}
.seat.taken{background:var(--taken)}
.seat.mine{background:var(--mine);color:#241a05}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);margin-bottom:10px}.stats b{color:var(--ink)}
#log{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto;font:.85rem Consolas,monospace}
#log li{padding:3px 0;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<main>
<h1>Theatre seat allocation</h1>
<p class="sub">Each row is a linked list of seats. Booking walks the list node by node.</p>

<section class="box">
<h2>Book seats</h2>
<div class="row">
<label>Name <input id="name" maxlength="20" placeholder="Asha"></label>
<label>Seats together <input id="count" type="number" min="1" max="10" value="2" style="width:90px"></label>
<button id="auto">Auto-allocate</button>
<label>Find a name <input id="find" placeholder="Asha" style="width:130px"></label>
<button id="search">Search</button>
</div>
<p id="msg" role="status">Tap a green seat to book it for the name above. Tap a booked seat to cancel it.</p>
</section>

<section class="box">
<div class="stats"><span>Total: <b id="tot">0</b></span><span>Booked: <b id="bk">0</b></span><span>Free: <b id="fr">0</b></span></div>
<div class="screen" aria-label="Screen"></div>
<div class="hall" id="hall"></div>
<div class="legend"><span><i style="background:var(--free)"></i>Free</span><span><i style="background:var(--taken)"></i>Booked</span><span><i style="background:var(--mine)"></i>Search match</span></div>
</section>

<section class="box"><h2>Operation log</h2><ul id="log"></ul></section>
</main>

<script>
// ---- Each row is a singly linked list of Seat nodes ----
class Seat { constructor(num){ this.num = num; this.owner = null; this.next = null; } }
class SeatRow {
  constructor(label, n){
    this.label = label; this.head = null;
    let tail = null;
    for (let i = 1; i <= n; i++){          // build the list
      const s = new Seat(i);
      if (!this.head) this.head = s; else tail.next = s;
      tail = s;
    }
  }
  find(num){                                 // O(n): walk until the seat number matches
    let c = this.head;
    while (c && c.num !== num) c = c.next;
    return c;
  }
  findAdjacent(k){                           // O(n): look for k free seats in a row
    let run = [], c = this.head;
    while (c){
      if (c.owner === null){ run.push(c); if (run.length === k) return run; }
      else run = [];
      c = c.next;
    }
    return null;
  }
  nodes(){ const a = []; for (let c = this.head; c; c = c.next) a.push(c); return a; }
}

const rows = 'ABCDEF'.split('').map(l => new SeatRow(l, 10));
let highlight = '';
const $ = id => document.getElementById(id);
const say = t => $('msg').textContent = t;
function log(t){ const li = document.createElement('li'); li.textContent = new Date().toLocaleTimeString() + '  ' + t; $('log').prepend(li); }
const nameVal = () => $('name').value.trim();

function render(){
  const hall = $('hall'); hall.innerHTML = '';
  let booked = 0;
  rows.forEach(r => {
    const rw = document.createElement('div'); rw.className = 'rw';
    const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = r.label; rw.append(lab);
    r.nodes().forEach(s => {
      const b = document.createElement('button');
      const match = highlight && s.owner && s.owner.toLowerCase() === highlight.toLowerCase();
      b.className = 'seat' + (s.owner ? ' taken' : '') + (match ? ' mine' : '');
      b.textContent = s.num;
      b.setAttribute('aria-label', `Seat ${r.label}${s.num}, ${s.owner ? 'booked by ' + s.owner : 'free'}`);
      b.onclick = () => clickSeat(r, s.num);
      if (s.owner) booked++;
      rw.append(b);
    });
    hall.append(rw);
  });
  $('tot').textContent = rows.length * 10; $('bk').textContent = booked; $('fr').textContent = rows.length * 10 - booked;
}

function clickSeat(r, num){
  const s = r.find(num), id = r.label + num;
  if (s.owner){ log(`cancel ${id} (was ${s.owner})`); say(`Cancelled seat ${id}.`); s.owner = null; }
  else {
    if (!nameVal()){ say('Enter a name first.'); $('name').focus(); return; }
    s.owner = nameVal(); log(`book ${id} for ${s.owner}`); say(`Booked seat ${id} for ${s.owner}.`);
  }
  render();
}

$('auto').onclick = () => {
  const k = parseInt($('count').value, 10), name = nameVal();
  if (!name){ say('Enter a name first.'); return; }
  if (!(k >= 1 && k <= 10)){ say('Choose between 1 and 10 seats.'); return; }
  for (const r of rows){
    const run = r.findAdjacent(k);
    if (run){
      run.forEach(s => s.owner = name);
      const ids = run.map(s => r.label + s.num).join(', ');
      log(`auto-allocate ${k} for ${name}: ${ids}`); say(`Allocated ${ids} to ${name}.`); render(); return;
    }
  }
  say(`No row has ${k} free seats together.`); log(`auto-allocate failed for ${name} (${k} seats)`);
};

$('search').onclick = () => {
  highlight = $('find').value.trim();
  if (!highlight){ say('Type a name to find.'); return; }
  const found = [];
  rows.forEach(r => r.nodes().forEach(s => { if (s.owner && s.owner.toLowerCase() === highlight.toLowerCase()) found.push(r.label + s.num); }));
  say(found.length ? `${highlight}: ${found.join(', ')}` : `No bookings found for ${highlight}.`);
  log(`search "${highlight}" → ${found.length} seat(s)`);
  render();
};

render();
</script>
</body>
</html>
